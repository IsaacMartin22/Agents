name: PR Agent Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      agent:
        description: Agent to run for this review
        required: true
        default: documentation-agent
        type: choice
        options:
          - documentation-agent
          - code-review-agent
          - security-agent

jobs:
  agent-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run selected agent
        env:
          AGENT_NAME: ${{ github.event.inputs.agent || 'documentation-agent' }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
        run: |
          agent --run --agent "${AGENT_NAME}" --event "${EVENT_NAME}" --repo "${REPO}" --sha "${SHA}" --ref "${REF}" --pr-number "${PR_NUMBER}"
